services:
  job-agent:
    build: .
    command: uvicorn job_agent.api:app --host 0.0.0.0 --port 8000
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["./data:/app/data", "./config:/app/config"]
    restart: unless-stopped
  dashboard:
    build: .
    command: streamlit run dashboard.py --server.address 0.0.0.0 --server.port 8501
    environment:
      API_URL: http://job-agent:8000
    ports: ["8501:8501"]
    env_file: [.env]
    volumes: ["./data:/app/data", "./config:/app/config"]
    restart: unless-stopped
